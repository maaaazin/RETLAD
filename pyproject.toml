[project]
name = "realtime-log-anomaly-detection"
version = "0.1.0"
description = "Real-time web server log analysis and anomaly detection using Kafka and Spark Structured Streaming."
requires-python = ">=3.11,<3.13"
dependencies = [
    "confluent-kafka>=2.15.1",
    "faker>=40.41.0",
    "psycopg[binary]>=3.3.6",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
]
